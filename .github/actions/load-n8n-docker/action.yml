# Restores the n8n + runners image tarball (produced by build-n8n-docker
# under the variant+SHA-derived key) and loads both images into the local
# docker daemon.
#
# After this action runs, `n8nio/n8n:local` and `n8nio/runners:local` are
# present on the runner.
#
# On Blacksmith the tarball comes off a mounted sticky disk, so a shard reads
# it locally instead of downloading ~436 MB. Off Blacksmith it comes from the
# GHA cache, unchanged. Either way, if the tarball is absent the action falls
# back to build-n8n-docker, which leaves both images tagged in dockerd.
#
# The disk is mounted read-only (`commit: false`): only the producer publishes
# a snapshot. A consumer that committed would race the other shards.

name: 'Load n8n Docker images'
description: 'Restores the zstd-compressed n8n + runners image tarball from the variant+SHA-keyed sticky disk (Blacksmith) or GHA cache, and loads both images into the local docker daemon. Falls back to rebuilding when absent.'

inputs:
  build-variant:
    description: 'Variant of the image to load. Must match what build-n8n-docker used (standard, coverage, or pc).'
    required: false
    default: 'standard'
  cache-sha:
    description: 'SHA for the image key. Empty = github.sha. Override when testing a ref other than the triggering commit (e.g. a PR head resolved at dispatch time) so the restore matches the code under test instead of a stale image (miss => rebuild from the checkout).'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Resolve image transport
      id: transport
      shell: bash
      env:
        RUNNER_NAME: ${{ runner.name }}
      run: |
        if [[ "$RUNNER_NAME" == *blacksmith* ]]; then
          echo "sticky=true" >> "$GITHUB_OUTPUT"
        else
          echo "sticky=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Mount sticky disk
      if: steps.transport.outputs.sticky == 'true'
      uses: useblacksmith/stickydisk@74f3f01ab1392726dd6ee06904f0452b0ec1e151 # v1.6.0
      with:
        key: n8n-docker-image-${{ inputs.build-variant }}-${{ inputs.cache-sha || github.sha }}
        path: /tmp/n8n-image
        commit: false

    - name: Restore image tarball from cache
      if: steps.transport.outputs.sticky != 'true'
      id: restore
      uses: actions/cache/restore@640a1c2554105b57832a23eea0b4672fc7a790d5 # v4.2.3
      with:
        key: n8n-docker-image-${{ inputs.build-variant }}-${{ inputs.cache-sha || github.sha }}
        path: /tmp/n8n-image.tar.zst

    # One line per shard naming the transport and whether it hit, so a run can
    # be read as "did every shard get the image, and from where".
    - name: Resolve tarball
      id: tarball
      shell: bash
      env:
        STICKY: ${{ steps.transport.outputs.sticky }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        BUILD_VARIANT: ${{ inputs.build-variant }}
        IMAGE_SHA: ${{ inputs.cache-sha || github.sha }}
      run: |
        if [ "$STICKY" = "true" ]; then
          if [ -s /tmp/n8n-image/n8n-image.tar.zst ]; then
            echo "path=/tmp/n8n-image/n8n-image.tar.zst" >> "$GITHUB_OUTPUT"
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "image transport=sticky-disk result=hit key=n8n-docker-image-$BUILD_VARIANT-$IMAGE_SHA"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "image transport=sticky-disk result=miss key=n8n-docker-image-$BUILD_VARIANT-$IMAGE_SHA"
          fi
        elif [ "$CACHE_HIT" = "true" ]; then
          echo "path=/tmp/n8n-image.tar.zst" >> "$GITHUB_OUTPUT"
          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "image transport=gha-cache result=hit key=n8n-docker-image-$BUILD_VARIANT-$IMAGE_SHA"
        else
          echo "hit=false" >> "$GITHUB_OUTPUT"
          echo "image transport=gha-cache result=miss key=n8n-docker-image-$BUILD_VARIANT-$IMAGE_SHA"
        fi

    - name: Load n8n and runners images into docker
      if: steps.tarball.outputs.hit == 'true'
      shell: bash
      env:
        TARBALL: ${{ steps.tarball.outputs.path }}
      run: zstd -d -c "$TARBALL" | docker load

    - name: Warn on miss
      if: steps.tarball.outputs.hit != 'true'
      shell: bash
      env:
        BUILD_VARIANT: ${{ inputs.build-variant }}
        IMAGE_SHA: ${{ inputs.cache-sha || github.sha }}
      run: |
        echo "::warning::Miss for n8n-docker-image-$BUILD_VARIANT-$IMAGE_SHA; falling back to rebuild via build-n8n-docker."

    - name: Rebuild image on miss
      if: steps.tarball.outputs.hit != 'true'
      uses: ./.github/actions/build-n8n-docker
      with:
        build-variant: ${{ inputs.build-variant }}
        # The disk is already mounted read-only above. Rebuilding leaves both
        # images tagged in dockerd, which is all this job needs.
        publish: 'false'
