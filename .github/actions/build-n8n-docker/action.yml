# Builds the n8n and runners CI test images (n8nio/n8n:local +
# n8nio/runners:local) and publishes the tarball under a variant+SHA-derived
# key so downstream jobs in the same workflow run can restore it via
# load-n8n-docker.
#
# Two transports, chosen by runner:
#   Blacksmith -> sticky disk. Mounted, not downloaded, so the 16 e2e shards
#                 read the tarball off a local filesystem instead of pulling
#                 ~436 MB each. Also keeps a single-run artifact out of the
#                 50 GB actions cache, which it was saturating (DEVP-912).
#   GitHub     -> actions/cache, unchanged. Sticky disks only exist on
#                 Blacksmith runners.
#
# Cache-aware on both paths: if the tarball for this SHA already exists, the
# build is skipped and this action is a no-op.

name: 'Build n8n CI Docker image'
description: 'Builds n8nio/n8n + n8nio/runners test images and publishes them as a variant+SHA-keyed tarball (Blacksmith sticky disk, or GHA cache off Blacksmith) for downstream shards.'

inputs:
  build-variant:
    description: 'standard, coverage, or pc. Coverage uses build:docker:coverage. pc builds n8n on the pointer-compressed Node base images.'
    required: false
    default: 'standard'
  publish:
    description: 'Publish the built tarball for other jobs to restore. Set false when called as load-n8n-docker''s fallback: that job already mounted the disk read-only, so re-mounting would conflict and the build already leaves both images tagged in dockerd.'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Resolve image transport
      id: transport
      shell: bash
      env:
        RUNNER_NAME: ${{ runner.name }}
      run: |
        if [[ "$RUNNER_NAME" == *blacksmith* ]]; then
          echo "sticky=true" >> "$GITHUB_OUTPUT"
        else
          echo "sticky=false" >> "$GITHUB_OUTPUT"
        fi

    # `if-missing` commits only when the disk was freshly formatted, i.e. this
    # job is the first producer for the SHA. A job that hydrates an existing
    # snapshot already has the tarball and must not re-commit it.
    - name: Mount sticky disk
      if: steps.transport.outputs.sticky == 'true' && inputs.publish == 'true'
      uses: useblacksmith/stickydisk@74f3f01ab1392726dd6ee06904f0452b0ec1e151 # v1.6.0
      with:
        key: n8n-docker-image-${{ inputs.build-variant }}-${{ github.sha }}
        path: /tmp/n8n-image
        commit: if-missing

    - name: Check sticky disk for existing image
      if: steps.transport.outputs.sticky == 'true' && inputs.publish == 'true'
      id: sticky-check
      shell: bash
      run: |
        if [ -s /tmp/n8n-image/n8n-image.tar.zst ]; then
          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "Sticky disk already holds the image for this SHA; skipping build."
        else
          echo "hit=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Check cache for existing image
      if: steps.transport.outputs.sticky != 'true' && inputs.publish == 'true'
      id: cache-check
      uses: actions/cache/restore@640a1c2554105b57832a23eea0b4672fc7a790d5 # v4.2.3
      with:
        key: n8n-docker-image-${{ inputs.build-variant }}-${{ github.sha }}
        path: /tmp/n8n-image.tar.zst
        lookup-only: true

    - name: Resolve whether a build is needed
      id: need-build
      shell: bash
      env:
        PUBLISH: ${{ inputs.publish }}
        STICKY: ${{ steps.transport.outputs.sticky }}
        STICKY_HIT: ${{ steps.sticky-check.outputs.hit }}
        CACHE_HIT: ${{ steps.cache-check.outputs.cache-hit }}
      run: |
        if [ "$PUBLISH" != "true" ]; then
          echo "build=true" >> "$GITHUB_OUTPUT"
        elif [ "$STICKY" = "true" ]; then
          [ "$STICKY_HIT" = "true" ] && echo "build=false" >> "$GITHUB_OUTPUT" || echo "build=true" >> "$GITHUB_OUTPUT"
        else
          [ "$CACHE_HIT" = "true" ] && echo "build=false" >> "$GITHUB_OUTPUT" || echo "build=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Build Docker image
      if: steps.need-build.outputs.build == 'true'
      uses: ./.github/actions/setup-nodejs
      with:
        build-command: ${{ inputs.build-variant == 'coverage' && 'pnpm build:docker:coverage' || 'pnpm build:docker' }}
        enable-docker-cache: true
      env:
        INCLUDE_TEST_CONTROLLER: 'true'
        # Keep the pc pins in sync with the -pc build in docker-build-push.yml.
        BUILDER_IMAGE: ${{ inputs.build-variant == 'pc' && 'n8nio/node-pc:26.7.0-dev@sha256:c64642dcb9464e50bd08aef8504affafeb795d01aed2f7ab158976c334a36ef6' || '' }}
        RUNTIME_IMAGE: ${{ inputs.build-variant == 'pc' && 'n8nio/node-pc:26.7.0@sha256:6577d0742ad043baaa39db7dda2ce8aeb73f32c84eb241c49bf716f170c53297' || '' }}

    - name: Assert pointer compression
      if: steps.need-build.outputs.build == 'true' && inputs.build-variant == 'pc'
      shell: bash
      run: |
        docker run --rm --entrypoint node n8nio/n8n:local -e "
          if (!process.config.variables.v8_enable_pointer_compression) {
            throw new Error('pc variant image is not pointer-compressed');
          }
          console.log(process.version, 'pointer compression: on');
        "

    # Write to a temp name and rename, so a consumer that mounts the disk
    # mid-write never sees a truncated tarball. rename(2) is atomic within a
    # filesystem.
    - name: Save image tarball to sticky disk
      if: steps.need-build.outputs.build == 'true' && inputs.publish == 'true' && steps.transport.outputs.sticky == 'true'
      shell: bash
      run: |
        docker save n8nio/n8n:local n8nio/runners:local | zstd -T0 -3 -o /tmp/n8n-image/.n8n-image.tar.zst.partial
        mv /tmp/n8n-image/.n8n-image.tar.zst.partial /tmp/n8n-image/n8n-image.tar.zst
        ls -lh /tmp/n8n-image/n8n-image.tar.zst

    - name: Save image tarball
      if: steps.need-build.outputs.build == 'true' && inputs.publish == 'true' && steps.transport.outputs.sticky != 'true'
      shell: bash
      run: |
        docker save n8nio/n8n:local n8nio/runners:local | zstd -T0 -3 -o /tmp/n8n-image.tar.zst
        ls -lh /tmp/n8n-image.tar.zst

    - name: Publish image tarball to cache
      if: steps.need-build.outputs.build == 'true' && inputs.publish == 'true' && steps.transport.outputs.sticky != 'true'
      uses: actions/cache/save@640a1c2554105b57832a23eea0b4672fc7a790d5 # v4.2.3
      with:
        key: n8n-docker-image-${{ inputs.build-variant }}-${{ github.sha }}
        path: /tmp/n8n-image.tar.zst
